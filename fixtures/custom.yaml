extends: ["spectral:oas"]
functions: [lowercase]
rules:
  jsonpath-fallback:
    given: $.paths[*][*][?(@property === "operationId" && @ === "getHealth")]^.tags
    severity: error
    then:
      function: falsy
  custom-function:
    given: $.info.title
    severity: error
    then:
      function: lowercase
